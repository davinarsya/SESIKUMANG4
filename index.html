const input = document.getElementById('nrp');
const button = document.getElementById('check');
const result = document.getElementById('result');
function cari(){
  const nrp = input.value.replace(/\D/g,'').trim();
  result.className = 'result show';
  if(!nrp){
    result.classList.add('error');
    result.innerHTML = '<div class="eyebrow">NRP BELUM DIISI</div><div class="error-title">Masukkan NRP terlebih dahulu</div><div class="error-text">Isi kolom NRP untuk melihat jadwal sesi makan bersama.</div>';

  }
  const data = peserta.find(p => p.nrp === nrp);
  if(data){
    result.classList.add('success');
    result.innerHTML = `<div class="result-top"><span class="eyebrow">DATA PESERTA DITEMUKAN</span><span class="status">✓ TERDAFTAR</span></div>

    result.classList.add('error');
    result.innerHTML = '<div class="eyebrow">DATA TIDAK DITEMUKAN</div><div class="error-title">NRP belum terdaftar</div><div class="error-text">Periksa kembali NRP yang kamu masukkan. Jika masih belum ditemukan, hubungi panitia Kumang Agenda 4.</div>';
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

input.addEventListener('keydown',e=>{if(e.key==='Enter')cari()});
